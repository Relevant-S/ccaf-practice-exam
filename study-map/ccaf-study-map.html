<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCAF Study Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a pannable bubble map on the left, the lesson panel on the right; stacked on phones. */
:root {
  --bg: #f3f2ee;
  --surface: #fbfaf7;
  --ink: #1d2230;
  --ink-soft: #545b6b;
  --line: #c9c6bd;
  --track: #e2dfd7;
  --focus: #2b5bd7;
  --good: #2f7d4f;
  --bad: #b23a3a;
  --d1: #4b5bd6; --d2: #148a8a; --d3: #c27a12; --d4: #9a3f8f; --d5: #3d7f2e; --b0: #4f6d8a;
  --scen: #6b7280;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171f; --surface: #1b1f29; --ink: #e8e9ee; --ink-soft: #a3a9b8;
    --line: #3a4050; --track: #2a2f3b; --focus: #7aa2ff; --good: #5fc287; --bad: #ef7b7b;
    --d1: #8c97ff; --d2: #3fc4c4; --d3: #f0a83a; --d4: #d27fc8; --d5: #7cc46a; --scen: #9aa1ad; --b0: #8fb3d6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171f; --surface: #1b1f29; --ink: #e8e9ee; --ink-soft: #a3a9b8;
  --line: #3a4050; --track: #2a2f3b; --focus: #7aa2ff; --good: #5fc287; --bad: #ef7b7b;
  --d1: #8c97ff; --d2: #3fc4c4; --d3: #f0a83a; --d4: #d27fc8; --d5: #7cc46a; --scen: #9aa1ad; --b0: #8fb3d6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body); }
button { font: inherit; color: inherit; }
a { color: var(--focus); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
header.bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { font: 700 1.25rem/1.1 var(--font-display); letter-spacing: -0.01em; margin: 0; }
.brand small { display: block; font: 400 0.78rem/1.3 var(--font-body); color: var(--ink-soft); letter-spacing: 0; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 0.9rem; min-width: 0; }
.crumbs button { background: none; border: 0; padding: 2px 6px; border-radius: 6px; cursor: pointer; color: var(--ink-soft); }
.crumbs button:hover { background: var(--track); color: var(--ink); }
.crumbs button[aria-current="true"] { color: var(--ink); font-weight: 700; }
.crumbs span { color: var(--line); }
.bar-tools { margin-left: auto; display: flex; gap: 8px; }
.tool { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 10px; font-size: 0.85rem; cursor: pointer; }
.tool:hover { border-color: var(--ink-soft); }

.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
#map.dragging { cursor: grabbing; }
.legend { position: absolute; left: 12px; bottom: 12px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 0.78rem; display: grid; gap: 4px; max-width: calc(100% - 24px); }
.legend .row { display: flex; align-items: center; gap: 8px; }
.legend svg { flex: none; }

.node { cursor: pointer; }
.node text { font-family: var(--font-body); fill: var(--ink); pointer-events: none; }
.node .label { font-size: 13px; font-weight: 700; }
.node .sub { font-size: 11px; fill: var(--ink-soft); }
.node .code { font-family: var(--font-mono); font-weight: 600; }
.node.dim { opacity: 0.45; }
.node .halo { fill: none; stroke: var(--focus); stroke-width: 3; opacity: 0; }
.node.is-focus .halo { opacity: 1; }
.node:focus-visible { outline: none; }
.node:focus-visible .halo { opacity: 1; stroke-dasharray: 4 3; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.edge.related { stroke-dasharray: 3 5; stroke-width: 1.6; }

aside.panel { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; min-height: 0; }
.panel-inner { padding: 22px 24px 48px; display: grid; gap: 22px; }
.eyebrow { font: 600 0.72rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); display: flex; gap: 10px; flex-wrap: wrap; }
.eyebrow .chip { padding: 2px 8px; border-radius: 99px; background: var(--track); color: var(--ink); }
.panel h2 { font: 700 1.6rem/1.15 var(--font-display); margin: 6px 0 0; text-wrap: balance; letter-spacing: -0.01em; }
.panel h3 { font: 700 1.02rem/1.3 var(--font-display); margin: 0 0 8px; }
.panel p { margin: 0 0 10px; max-width: 62ch; }
.panel ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.panel section { display: grid; gap: 4px; }
code { font: 0.86em var(--font-mono); background: var(--track); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
pre { font: 0.82rem/1.5 var(--font-mono); background: var(--track); padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 6px 0 0; }
.drift { border-left: 3px solid var(--d3); background: color-mix(in srgb, var(--d3) 10%, var(--surface)); padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 0.92rem; }
.drift b { display: block; font-family: var(--font-display); }
.weights { display: grid; gap: 6px; }
.weights button { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) 3em; align-items: center; gap: 8px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.weights .bar { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
.weights .bar i { display: block; height: 100%; }
.weights .pct { font: 0.85rem var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }

details.case { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
details.case + details.case { margin-top: 8px; }
details.case summary { cursor: pointer; padding: 10px 12px; list-style: none; display: flex; gap: 10px; align-items: baseline; }
details.case summary::-webkit-details-marker { display: none; }
details.case summary::before { content: "+"; font: 700 1rem var(--font-mono); color: var(--ink-soft); width: 1ch; }
details.case[open] summary::before { content: "−"; }
details.case .scen { font: 0.72rem var(--font-mono); color: var(--ink-soft); margin-left: auto; white-space: nowrap; }
details.case .body { padding: 0 14px 12px 32px; display: grid; gap: 8px; }
.step { display: grid; grid-template-columns: 6.6em minmax(0, 1fr); gap: 8px; font-size: 0.95rem; }
.step b { font: 600 0.72rem/1.9 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
.step.wrong b { color: var(--bad); }
.step.right b { color: var(--good); }
details.case.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--focus); } to { box-shadow: 0 0 0 0 transparent; } }

.check { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
.check p { margin: 0; }
.check .opts { display: grid; gap: 6px; }
.check .opts button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.check .opts button:hover:not(:disabled) { border-color: var(--ink-soft); }
.check .opts button.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--bg)); }
.check .opts button.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--bg)); }
.check .why { font-size: 0.93rem; }
.check .again { justify-self: start; background: none; border: 0; padding: 0; color: var(--focus); cursor: pointer; text-decoration: underline; font-size: 0.85rem; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 400; }
.btn[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.note { font-size: 0.85rem; color: var(--ink-soft); }
.copybox { font: 0.82rem var(--font-mono); width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); color: var(--ink); resize: none; }
.tasklist { display: grid; gap: 6px; }
.tasklist button { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 10px; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.tasklist button:hover { border-color: var(--ink-soft); }
.tasklist .n { font: 600 0.75rem/1.6 var(--font-mono); color: var(--ink-soft); }

.term { border-bottom: 1.5px dotted var(--ink-soft); cursor: help; }
#tip { position: fixed; z-index: 10; max-width: 290px; background: var(--ink); color: var(--bg); padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; line-height: 1.4; pointer-events: none; }
#tip b { display: block; }

.plain { background: color-mix(in srgb, var(--b0) 12%, var(--surface)); border-radius: 10px; padding: 10px 12px; font-size: 1rem; }
.plain b { font-family: var(--font-display); margin-right: 6px; }
.bridge { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-size: 0.95rem; }
.bridge b { display: block; font-family: var(--font-display); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 3px 10px; font-size: 0.85rem; cursor: pointer; }
.chips button:hover { border-color: var(--ink-soft); }
.chips button.done { border-color: var(--good); }
.chips button.done::after { content: " ✓"; color: var(--good); }
.path { display: grid; gap: 4px; counter-reset: p; }
.path button { display: grid; grid-template-columns: 1.8em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--track); padding: 6px 0; cursor: pointer; }
.path button::before { counter-increment: p; content: counter(p); font: 600 0.8rem var(--font-mono); color: var(--ink-soft); }
.path button .st { font-size: 0.78rem; color: var(--ink-soft); }
.path button.done .st { color: var(--good); }
.path button.next { font-weight: 700; }
.path button.next .st { color: var(--focus); }
.pin rect { fill: var(--focus); }
.pin text { fill: #fff !important; font: 700 10px var(--font-body); letter-spacing: 0.06em; }

.onb { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; place-items: center; padding: 16px; }
.onb-card { width: min(620px, 100%); max-height: calc(100% - 8px); overflow-y: auto; background: var(--surface); border-radius: 16px; padding: 24px; display: grid; gap: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.onb-card h2 { font: 700 1.5rem/1.2 var(--font-display); margin: 0; text-wrap: balance; }
.onb-card p { margin: 0; }
.onb-steps { font: 600 0.72rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); }
.choices { display: grid; gap: 8px; }
.choices button, .choices label { display: flex; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.choices button:hover, .choices label:hover { border-color: var(--ink-soft); }
.choices input { width: 18px; height: 18px; accent-color: var(--focus); }
.choices button.unsure { color: var(--ink-soft); font-style: italic; }
.onb-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--focus); text-decoration: underline; cursor: pointer; font-size: 0.9rem; }
.track { display: inline-block; font: 700 0.8rem var(--font-mono); padding: 3px 10px; border-radius: 99px; background: var(--ink); color: var(--bg); }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 56vh auto; height: auto; }
  aside.panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .panel-inner { padding: 20px 16px 48px; }
  header.bar { padding: 10px 16px; }
  .bar-tools { margin-left: 0; }
  .legend { font-size: 0.72rem; }
}
@media (prefers-reduced-motion: reduce) { details.case.flash { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1 class="brand">CCAF Study Map<small>Claude Certified Architect – Foundations</small></h1>
    <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
    <div class="bar-tools">
      <button class="tool" id="placement" type="button">Placement</button>
      <button class="tool" id="fit" type="button">Fit map</button>
      <button class="tool" id="reset" type="button">Reset progress</button>
    </div>
  </header>
  <div class="stage">
    <svg id="map" role="group" aria-label="Study map. Use Tab to move between bubbles and Enter to open one."></svg>
    <div class="legend" aria-label="Legend">
      <div class="row"><svg width="36" height="10" aria-hidden="true"><line x1="0" y1="5" x2="36" y2="5" stroke="currentColor" stroke-width="2"/></svg>Topic inside a topic</div>
      <div class="row"><svg width="36" height="10" aria-hidden="true"><line x1="0" y1="5" x2="36" y2="5" stroke="currentColor" stroke-width="2" stroke-dasharray="3 5"/></svg>Case or scenario linked to it</div>
      <div class="row"><svg width="36" height="18" viewBox="-9 -9 18 18" aria-hidden="true" id="legend-pie"></svg>Ring fills as you go: read · cases · check</div>
      <div class="row"><svg width="36" height="18" viewBox="-9 -9 18 18" aria-hidden="true" id="legend-done"></svg>Solid with ✓: done</div>
    </div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
<div id="tip" hidden></div>
<div class="onb" id="onb" hidden role="dialog" aria-modal="true" aria-labelledby="onb-title"><div class="onb-card" id="onb-card"></div></div>

<script>
/* ---------- Glossary: plain definitions shown on hover or tap ---------- */
const GLOSSARY = {
  "claude code": ["Claude Code", "Anthropic's coding assistant that runs in your terminal or editor. It reads your project, runs commands and edits files."],
  "claude.md": ["CLAUDE.md", "A plain Markdown file of instructions that Claude Code reads at the start of a session. Think of it as a briefing note."],
  "skill": ["Skill", "A saved, reusable workflow for Claude Code, stored as a SKILL.md file. You run it by typing /its-name."],
  "slash command": ["Slash command", "A shortcut you type in Claude Code, like /review. Custom ones are saved as files in the project or your home folder."],
  "frontmatter": ["Frontmatter", "A small settings block at the very top of a Markdown file, between two lines of ---. It holds options like paths or context."],
  "glob": ["Glob pattern", "A file-matching pattern. ** means any folders, * means any characters. **/*.test.tsx matches every test file in every folder."],
  "subagent": ["Subagent", "A helper Claude session that gets its own task and its own memory, then returns only its result to the main session."],
  "context": ["Context window", "Everything Claude can 'see' right now: instructions, the conversation, file contents. It has a size limit, so clutter pushes out useful detail."],
  "plan mode": ["Plan mode", "A Claude Code mode where Claude can read and explore but not edit. It writes a plan; edits wait until you approve it."],
  "ci/cd": ["CI/CD", "Continuous integration and delivery: automated jobs that run on every push or pull request, such as tests, builds and reviews. No human is at the keyboard."],
  "version control": ["Version control", "Git and similar tools. Files committed to the repository are shared with everyone who clones it; files in your home folder are not."],
  "home folder": ["Home folder", "Your personal folder on your own machine, written as ~. Files there are never shared through the repository."],
  "distractor": ["Distractor", "A wrong answer option written to look right to someone with partial knowledge."],
  "json schema": ["JSON Schema", "A description of the exact shape a JSON result must have: which fields, which types. Tools can check output against it."],
  "pull request": ["Pull request", "A proposed change to a repository that others review before it is merged."],
  "mcp": ["MCP", "Model Context Protocol: a standard way to connect Claude to outside systems (databases, ticket systems, APIs) as tools."],
  "agent": ["Agent", "Claude working in a loop: it decides on a step, uses a tool, looks at the result, and decides the next step until the job is done."],
  "git": ["Git", "A tool that keeps the full history of a project's files and lets a team share changes. GitHub is a website that hosts git projects."],
  "repository": ["Repository (repo)", "A project folder tracked by git: all its files plus their history. Cloning it copies it to your machine."],
  "terminal": ["Terminal", "A text window where you run programs by typing commands instead of clicking."],
  "flag": ["Flag", "An option added to a command, starting with - or --. In claude -p, the -p is a flag."],
  "json": ["JSON", "A text format for structured data, with named fields in curly braces. Programs read it reliably."],
  "api": ["API", "A way for one program to ask another for something: send a request, get a response."],
  "token": ["Token", "A piece of a word. Claude reads and writes text in tokens; the context window is measured in them."],
  "pipeline": ["Pipeline", "A chain of automatic steps (build, test, review) that runs when code changes."],
  "hook": ["Hook", "Your own code that runs automatically at a fixed moment, for example just before a tool runs. It can block an action, so it gives a guarantee a prompt cannot."]
};

/* ---------- Content ---------- */
const SCENARIOS = [
  { id: "s1", n: 1, name: "Support agent", title: "Customer Support Resolution Agent", text: "An agent handles returns, billing disputes and account issues. It reaches your systems through custom MCP tools such as get_customer, lookup_order, process_refund and escalate_to_human. The target is 80%+ of cases solved on first contact, while knowing when to hand over to a human.", domains: ["d1", "d2", "d5"] },
  { id: "s2", n: 2, name: "Code generation", title: "Code Generation with Claude Code", text: "Your team uses Claude Code for writing code, refactoring, debugging and documentation. You set it up with custom slash commands and CLAUDE.md files, and you decide when to use plan mode and when to let it act directly.", domains: ["d3", "d5"] },
  { id: "s3", n: 3, name: "Research system", title: "Multi-Agent Research System", text: "A coordinator agent hands work to specialist subagents: one searches the web, one analyses documents, one combines findings, one writes the report. The output is a full report with citations.", domains: ["d1", "d2", "d5"] },
  { id: "s4", n: 4, name: "Dev productivity", title: "Developer Productivity with Claude", text: "An agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate and automate repetitive tasks. It uses the built-in tools (Read, Write, Bash, Grep, Glob) and MCP servers.", domains: ["d2", "d3", "d1"] },
  { id: "s5", n: 5, name: "CI pipeline", title: "Claude Code for Continuous Integration", text: "Claude Code runs inside the CI/CD pipeline. It reviews code automatically, writes test cases and comments on pull requests. Feedback must be useful, with few false alarms.", domains: ["d3", "d4"] },
  { id: "s6", n: 6, name: "Data extraction", title: "Structured Data Extraction", text: "A system pulls information out of messy documents, checks the result against JSON schemas, and feeds it to other systems. It must stay accurate and handle odd cases well.", domains: ["d4", "d5"] }
];

const DOMAINS = [
  { id: "d1", code: "D1", name: "Agentic Architecture & Orchestration", short: "Agents", weight: 27, color: "--d1", ready: false,
    what: "How to build systems where Claude works in a loop: it picks a step, uses a tool, checks the result and carries on. Covers the agent loop, coordinators that hand work to helper agents (subagents), hooks that enforce hard rules, and resuming or forking sessions." },
  { id: "d2", code: "D2", name: "Tool Design & MCP Integration", short: "Tools & MCP", weight: 18, color: "--d2", ready: false,
    what: "How to give Claude tools it uses well: clear tool descriptions, useful error messages, connecting outside systems through MCP, and the built-in tools such as Read, Grep and Edit." },
  { id: "d3", code: "D3", name: "Claude Code Configuration & Workflows", short: "Claude Code", weight: 20, color: "--d3", ready: true,
    what: "How a team sets up Claude Code so it behaves the same for everyone: instruction files (CLAUDE.md), rules that apply only to some files, reusable skills and slash commands, choosing plan mode or direct action, steering Claude over several rounds, and running it inside automated pipelines.",
    why: "About one question in five. The questions are practical: a teammate is not getting the team's instructions, a pipeline hangs, a skill floods the chat. You need to know which setting fixes which problem, and which look-alike setting does not.",
    order: "Follow the numbered steps. Each one builds on the one before: where instructions live, then how to scope them, then reusable workflows, then how to run work, then how to steer it, then automation." },
  { id: "d4", code: "D4", name: "Prompt Engineering & Structured Output", short: "Prompts & output", weight: 20, color: "--d4", ready: false,
    what: "How to write prompts that give reliable results: explicit criteria, examples (few-shot), JSON schemas for structured output, checking and retrying output, and batch processing for large jobs." },
  { id: "d5", code: "D5", name: "Context Management & Reliability", short: "Context & reliability", weight: 15, color: "--d5", ready: false,
    what: "How to keep long conversations and multi-agent work reliable: what to keep in the context window, when to hand over to a human, how errors travel between agents, human review, and keeping track of where facts came from." }
];

const TASKS = [
  {
    id: "t3.1", code: "3.1", step: 1, domain: "d3", short: "CLAUDE.md levels", name: "Put instructions at the right level with CLAUDE.md",
    what: "A {{claude.md}} file is a set of instructions that {{claude code}} reads at the start of every session. Where you save it decides who gets it. Claude Code reads every file it finds and combines them. No file switches another one off.",
    why: "A classic exam question: something works for one person and not for a new teammate. The answer is almost always that the instruction lives at the wrong level.",
    ideas: [

        <label><input type="checkbox" id="plan-nodate">Not decided yet</label></div>
      <div><p style="margin:0 0 6px"><b>Hours per week you can realistically study</b></p><div class="choices">${radio("plan-hours", HOURS, "2-4")}</div></div>
      <div><p style="margin:0 0 6px"><b>How do you learn best?</b></p><div class="choices">${radio("plan-order", [["examples", "Examples first, then the rule"], ["rule", "The rule first, then examples"]], "examples")}</div></div>
      <div><p style="margin:0 0 6px"><b>Explanations</b></p><div class="choices">${radio("plan-style", [["short", "Short, with questions back to me"], ["long", "Longer and fuller"]], "short")}</div></div>
      <div><p style="margin:0 0 6px"><b>Practice quizzes with Richard</b></p><div class="choices">${radio("plan-mode", [["quick", "Quick: I pick a letter, and get explanations when I'm wrong"], ["deep", "Deep: I explain my reasoning before I see the answer"]], "quick")}</div>
      <p class="note" style="margin-top:6px">Most people start with quick and switch to deep closer to the exam.</p></div>
      <div class="onb-foot"><span></span><button type="button" class="btn" data-plan="1">See my starting point</button></div>`;
  } else {
    const r = onb.result;
    const gaps = r.gaps.length ? `<ul>${r.gaps.map(id => `<li>${esc(byId[id].code)} · ${esc(byId[id].name)}</li>`).join("")}</ul>` : "<p>No gaps in the basics we checked.</p>";
    h = `<div class="onb-steps">Your starting point</div><h2 id="onb-title"><span class="track">Track ${r.track}</span> ${TRACKS[r.track][0]}</h2>
      <p>${TRACKS[r.track][1]}</p>
      <div><h3 style="margin:0 0 6px;font:700 1rem var(--font-display)">Basics to strengthen</h3>${gaps}</div>
      ${remote ? `<div class="plain"><b>Next: go back to the chat and tell Richard “done”.</b> Your answers are saved with your map, so he reads them from here and takes it from there.</div>` : `<div><h3 style="margin:0 0 6px;font:700 1rem var(--font-display)">Tell Richard</h3><p class="note">Paste this into Claude Code in the ccaf repo, so the tutor starts at your level:</p>
      <textarea class="copybox" id="onb-prompt" rows="4" readonly>${esc(richardPrompt(r))}</textarea>
      <div class="actions" style="margin-top:6px"><button type="button" class="btn ghost" id="onb-copy">Copy prompt</button></div></div>`}
      <div class="onb-foot"><button type="button" class="linkbtn" data-back="role">Start over</button><button type="button" class="btn" data-done="1">Show my path</button></div>`;
  }
  onbCard.innerHTML = h;
  const first = onbCard.querySelector("button, input"); if (first) first.focus();
}
onbCard.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.skip) return closeOnboarding(true);
  if (b.dataset.role) { onb.role = b.dataset.role; onb.step = "exp"; return drawOnb(); }
  if (b.dataset.back) { onb.step = b.dataset.back; onb.i = 0; onb.answers = {}; return drawOnb(); }
  if (b.dataset.next) { onb.exp = [...onbCard.querySelectorAll("input:checked")].map(i => i.value); onb.probes = probeSet(onb.role, onb.exp); onb.i = 0; onb.answers = {}; onb.step = "probe"; return drawOnb(); }
  if (b.dataset.ans !== undefined) {
    onb.answers[onb.probes[onb.i]] = +b.dataset.ans;
    if (onb.i < onb.probes.length - 1) { onb.i++; } else { onb.step = "plan"; }
    return drawOnb();
  }
  if (b.dataset.plan) {
    const val = name => { const x = onbCard.querySelector(`input[name="${name}"]:checked`); return x ? x.value : null; };
    const date = onbCard.querySelector("#plan-date").value, nodate = onbCard.querySelector("#plan-nodate").checked;
    onb.plan = { examDate: nodate || !date ? null : date, hours: val("plan-hours"), examplesFirst: val("plan-order") !== "rule", style: val("plan-style") || "short", mode: val("plan-mode") || "quick" };
    onb.result = place(); progress.profile = onb.result; save(); onb.step = "result";
    return drawOnb();
  }
  if (b.id === "onb-copy") {
    const ta = onbCard.querySelector("#onb-prompt");
    try { navigator.clipboard.writeText(ta.value).then(() => { b.textContent = "Copied"; }, () => { ta.select(); b.textContent = "Press Ctrl+C to copy"; }); }
    catch (err) { ta.select(); b.textContent = "Press Ctrl+C to copy"; }
    return;
  }
  if (b.dataset.done) { closeOnboarding(false); focus = "root"; openCase = null; render(); renderPanel(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !onbEl.hidden) closeOnboarding(true); });
document.getElementById("placement").addEventListener("click", openOnboarding);
panel.addEventListener("click", e => { if (e.target.closest("[data-onb]")) openOnboarding(); });

/* ---------- Legend pie ---------- */
(function () {
  drawRing(document.getElementById("legend-pie"), 8.5, [1, 0.6, 0.3], "var(--d3)");
  const g = document.getElementById("legend-done");
  drawRing(g, 8.5, [1, 1, 1], "var(--d3)");
  const c = el("circle", { r: 5.6 }, g); c.style.fill = "var(--d3)";
})();

function practiceLine(t) {
  const pr = practice[t.code];
  if (!pr || !pr.answered) return remote ? "No quiz results yet. When Richard quizzes you on this topic, your score shows up here." : "Quiz results from Richard show up here when the map is opened as your own published page.";
  const pass = pr.answered >= 3 && pr.correct / pr.answered >= 0.8;
  return `${pr.correct} of ${pr.answered} right${pr.last ? ` · last on ${esc(pr.last)}` : ""}.${pass ? " That counts as the check part of the ring." : " 80% over at least 3 questions completes the ring's check part."}`;
}
function adoptPlacement(d) {
  if (!d || !d.track) return false;
  d = JSON.parse(JSON.stringify(d));
  const mine = progress.profile;
  if (mine && mine.at && d.at && mine.at >= d.at) return false;
  if (mine && !d.at) return false;
  progress.profile = { role: d.role || "other", exp: d.exp || [], gaps: d.gaps || [], track: d.track, concepts: d.concepts || 0, plan: d.plan || (mine && mine.plan) || null, date: d.date || "", at: d.at || "", source: d.source || "richard" };
  progress.skipped = false;
  save();
  return true;
}
async function connectStore() {
  if (!window.claude || !window.claude.use) return false;
  let db = null;
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) return false;
  remote = db;
  try {
    const snap = await db.doc("learner/progress").get();
    if (snap.exists) {
      applyRemote(snap.data() || {});
    } else if (progress.profile || Object.keys(progress.read).length) {
      save();
    }
  } catch (e) {}
  db.doc("learner/progress").onSnapshot(snap => {
    if (!snap.exists) return;
    applyRemote(snap.data() || {});
    paintAll();
    const n = byId[focus], mr = panel.querySelector("#mark-read");
    if (n.kind === "task" && mr) { const r = !!progress.read[n.id]; mr.setAttribute("aria-pressed", String(r)); mr.textContent = r ? "Lesson read ✓" : "Mark lesson as read"; }
    else if (n.kind !== "task") renderPanel();
  }, () => {});
  db.doc("learner/practice").onSnapshot(snap => {
    practice = snap.exists ? ((snap.data() || {}).tasks || {}) : {};
    paintAll();
    const pl = panel.querySelector("#practice-line");
    if (pl && byId[focus].kind === "task") pl.textContent = practiceLine(byId[focus]);
  }, () => {});
  db.doc("learner/placement").onSnapshot(snap => {
    if (snap.exists && adoptPlacement(snap.data())) {
      if (!onbEl.hidden) onbEl.hidden = true;
      render(); renderPanel();
    }
  }, () => {});
  return true;
}

render();
renderPanel();
(async () => {
  const connected = await Promise.race([connectStore(), new Promise(r => setTimeout(() => r(false), 4000))]);
  if (connected) { render(); renderPanel(); }
  if (!progress.profile && !progress.skipped) openOnboarding();
})();
</script>
</body>
</html>
