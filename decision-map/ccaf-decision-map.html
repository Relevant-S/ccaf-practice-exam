<html lang="en">

<title>CCAF Decision Map</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a pannable bubble map on the left, the lesson panel on the right; stacked on phones. */
:root {
  --bg: #f3f2ee;
  --surface: #fbfaf7;
  --ink: #1d2230;
  --ink-soft: #545b6b;
  --line: #c9c6bd;
  --track: #e2dfd7;
  --focus: #2b5bd7;
  --good: #2f7d4f;
  --bad: #b23a3a;
  --d1: #4b5bd6; --d2: #148a8a; --d3: #c27a12; --d4: #9a3f8f; --d5: #3d7f2e; --b0: #4f6d8a;
  --scen: #6b7280;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171f; --surface: #1b1f29; --ink: #e8e9ee; --ink-soft: #a3a9b8;
    --line: #3a4050; --track: #2a2f3b; --focus: #7aa2ff; --good: #5fc287; --bad: #ef7b7b;
    --d1: #8c97ff; --d2: #3fc4c4; --d3: #f0a83a; --d4: #d27fc8; --d5: #7cc46a; --scen: #9aa1ad; --b0: #8fb3d6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171f; --surface: #1b1f29; --ink: #e8e9ee; --ink-soft: #a3a9b8;
  --line: #3a4050; --track: #2a2f3b; --focus: #7aa2ff; --good: #5fc287; --bad: #ef7b7b;
  --d1: #8c97ff; --d2: #3fc4c4; --d3: #f0a83a; --d4: #d27fc8; --d5: #7cc46a; --scen: #9aa1ad; --b0: #8fb3d6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body); }
button { font: inherit; color: inherit; }
a { color: var(--focus); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
header.bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { font: 700 1.25rem/1.1 var(--font-display); letter-spacing: -0.01em; margin: 0; }
.brand small { display: block; font: 400 0.78rem/1.3 var(--font-body); color: var(--ink-soft); letter-spacing: 0; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 0.9rem; min-width: 0; }
.crumbs button { background: none; border: 0; padding: 2px 6px; border-radius: 6px; cursor: pointer; color: var(--ink-soft); }
.crumbs button:hover { background: var(--track); color: var(--ink); }
.crumbs button[aria-current="true"] { color: var(--ink); font-weight: 700; }
.crumbs span { color: var(--line); }
.bar-tools { margin-left: auto; display: flex; gap: 8px; }
.tool { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 10px; font-size: 0.85rem; cursor: pointer; }
.tool:hover { border-color: var(--ink-soft); }

.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
#map.dragging { cursor: grabbing; }
.legend { position: absolute; left: 12px; bottom: 12px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 0.78rem; display: grid; gap: 4px; max-width: calc(100% - 24px); }
.legend .row { display: flex; align-items: center; gap: 8px; }
.legend svg { flex: none; }

.node { cursor: pointer; }
.node text { font-family: var(--font-body); fill: var(--ink); pointer-events: none; }
.node .label { font-size: 13px; font-weight: 700; }
.node .sub { font-size: 11px; fill: var(--ink-soft); }
.node .code { font-family: var(--font-mono); font-weight: 600; }
.node.dim { opacity: 0.45; }
.node .halo { fill: none; stroke: var(--focus); stroke-width: 3; opacity: 0; }
.node.is-focus .halo { opacity: 1; }
.node:focus-visible { outline: none; }
.node:focus-visible .halo { opacity: 1; stroke-dasharray: 4 3; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.edge.related { stroke-dasharray: 3 5; stroke-width: 1.6; }

aside.panel { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; min-height: 0; }
.panel-inner { padding: 22px 24px 48px; display: grid; gap: 22px; }
.eyebrow { font: 600 0.72rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); display: flex; gap: 10px; flex-wrap: wrap; }
.eyebrow .chip { padding: 2px 8px; border-radius: 99px; background: var(--track); color: var(--ink); }
.panel h2 { font: 700 1.6rem/1.15 var(--font-display); margin: 6px 0 0; text-wrap: balance; letter-spacing: -0.01em; }
.panel h3 { font: 700 1.02rem/1.3 var(--font-display); margin: 0 0 8px; }
.panel p { margin: 0 0 10px; max-width: 62ch; }
.panel ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.panel section { display: grid; gap: 4px; }
code { font: 0.86em var(--font-mono); background: var(--track); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
pre { font: 0.82rem/1.5 var(--font-mono); background: var(--track); padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 6px 0 0; }
.drift { border-left: 3px solid var(--d3); background: color-mix(in srgb, var(--d3) 10%, var(--surface)); padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 0.92rem; }
.drift b { display: block; font-family: var(--font-display); }
.weights { display: grid; gap: 6px; }
.weights button { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) 3em; align-items: center; gap: 8px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.weights .bar { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
.weights .bar i { display: block; height: 100%; }
.weights .pct { font: 0.85rem var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }

details.case { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
details.case + details.case { margin-top: 8px; }
details.case summary { cursor: pointer; padding: 10px 12px; list-style: none; display: flex; gap: 10px; align-items: baseline; }
details.case summary::-webkit-details-marker { display: none; }
details.case summary::before { content: "+"; font: 700 1rem var(--font-mono); color: var(--ink-soft); width: 1ch; }
details.case[open] summary::before { content: "−"; }
details.case .scen { font: 0.72rem var(--font-mono); color: var(--ink-soft); margin-left: auto; white-space: nowrap; }
details.case .body { padding: 0 14px 12px 32px; display: grid; gap: 8px; }
.step { display: grid; grid-template-columns: 6.6em minmax(0, 1fr); gap: 8px; font-size: 0.95rem; }
.step b { font: 600 0.72rem/1.9 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
.step.wrong b { color: var(--bad); }
.step.right b { color: var(--good); }
details.case.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--focus); } to { box-shadow: 0 0 0 0 transparent; } }

.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 400; }
.btn[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.note { font-size: 0.85rem; color: var(--ink-soft); }
.copybox { font: 0.82rem var(--font-mono); width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); color: var(--ink); resize: none; }
.tasklist { display: grid; gap: 6px; }
.tasklist button { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 10px; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.tasklist button:hover { border-color: var(--ink-soft); }
.tasklist .n { font: 600 0.75rem/1.6 var(--font-mono); color: var(--ink-soft); }

.term { border-bottom: 1.5px dotted var(--ink-soft); cursor: help; }
#tip { position: fixed; z-index: 10; max-width: 290px; background: var(--ink); color: var(--bg); padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; line-height: 1.4; pointer-events: none; }
#tip b { display: block; }

.plain { background: color-mix(in srgb, var(--b0) 12%, var(--surface)); border-radius: 10px; padding: 10px 12px; font-size: 1rem; }
.plain b { font-family: var(--font-display); margin-right: 6px; }
.bridge { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-size: 0.95rem; }
.bridge b { display: block; font-family: var(--font-display); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 3px 10px; font-size: 0.85rem; cursor: pointer; }
.chips button:hover { border-color: var(--ink-soft); }
.chips button.done { border-color: var(--good); }
.chips button.done::after { content: " ✓"; color: var(--good); }
.path { display: grid; gap: 4px; counter-reset: p; }
.path button { display: grid; grid-template-columns: 1.8em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--track); padding: 6px 0; cursor: pointer; }
.path button::before { counter-increment: p; content: counter(p); font: 600 0.8rem var(--font-mono); color: var(--ink-soft); }
.path button .st { font-size: 0.78rem; color: var(--ink-soft); }
.path button.done .st { color: var(--good); }
.path button.next { font-weight: 700; }
.path button.next .st { color: var(--focus); }
.pin rect { fill: var(--focus); }
.pin text { fill: #fff !important; font: 700 10px var(--font-body); letter-spacing: 0.06em; }

.onb { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; place-items: center; padding: 16px; }
.onb-card { width: min(620px, 100%); max-height: calc(100% - 8px); overflow-y: auto; background: var(--surface); border-radius: 16px; padding: 24px; display: grid; gap: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.onb-card h2 { font: 700 1.5rem/1.2 var(--font-display); margin: 0; text-wrap: balance; }
.onb-card p { margin: 0; }
.onb-steps { font: 600 0.72rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); }
.choices { display: grid; gap: 8px; }
.choices button, .choices label { display: flex; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.choices button:hover, .choices label:hover { border-color: var(--ink-soft); }
.choices input { width: 18px; height: 18px; accent-color: var(--focus); }
.choices button.unsure { color: var(--ink-soft); font-style: italic; }
.onb-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--focus); text-decoration: underline; cursor: pointer; font-size: 0.9rem; }
.track { display: inline-block; font: 700 0.8rem var(--font-mono); padding: 3px 10px; border-radius: 99px; background: var(--ink); color: var(--bg); }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 56vh auto; height: auto; }
  aside.panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .panel-inner { padding: 20px 16px 48px; }
  header.bar { padding: 10px 16px; }
  .bar-tools { margin-left: 0; }
  .legend { font-size: 0.72rem; }
}
@media (prefers-reduced-motion: reduce) { details.case.flash { animation: none; } }

/* Switch between the study map and the decision map. */
.mapswitch { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 2px; background: var(--bg); font-size: 0.85rem; }
.mapswitch a, .mapswitch span { padding: 4px 12px; border-radius: 99px; text-decoration: none; color: var(--ink-soft); white-space: nowrap; }
.mapswitch a:hover { color: var(--ink); background: var(--track); }
.mapswitch [aria-current="page"] { background: var(--ink); color: var(--bg); font-weight: 700; }

/* Resizable panel: drag the handle on the panel's left edge (wide screens only). */
.app { grid-template-columns: minmax(0, 1fr) clamp(300px, var(--panel-w, 440px), 75vw); }
.panel-handle { position: absolute; top: 0; right: 0; bottom: 0; width: 12px; cursor: col-resize; z-index: 5; touch-action: none; }
.panel-handle::after { content: ""; position: absolute; top: 50%; left: 6px; width: 4px; height: 48px; margin-top: -24px; border-radius: 4px; background: var(--line); transition: background .15s; }
.panel-handle:hover::after, .panel-handle:focus-visible::after, .panel-handle.dragging::after { background: var(--focus); }
.panel-handle:focus-visible { outline: none; }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
.stage-handle { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto clamp(160px, var(--map-h, 56vh), 85vh) auto; }
  .panel-handle { display: none; }
  .stage-handle { display: block; position: absolute; left: 0; right: 0; bottom: 0; height: 18px; cursor: row-resize; z-index: 5; touch-action: none; }
  .stage-handle::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 56px; height: 5px; margin-left: -28px; border-radius: 5px; background: var(--line); transition: background .15s; }
  .stage-handle:hover::after, .stage-handle:focus-visible::after, .stage-handle.dragging::after { background: var(--focus); }
  .stage-handle:focus-visible { outline: none; }
}
body.resizing-v, body.resizing-v * { cursor: row-resize !important; user-select: none !important; }
</style>
<style>
/* Decision map: one flowchart on the left, details on the right. */
.router { display: grid; gap: 6px; }
.router button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: baseline; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.router button:hover { border-color: var(--ink-soft); }
.router .to { font: 600 0.8rem var(--font-mono); white-space: nowrap; }
.outcome { border-left: 4px solid var(--c); background: color-mix(in srgb, var(--c) 9%, var(--surface)); border-radius: 0 10px 10px 0; padding: 10px 12px; display: grid; gap: 6px; }
.outcome .answer { font-weight: 700; margin: 0; }
.outcome .why { margin: 0; font-size: 0.93rem; color: var(--ink-soft); }
ul.examples { list-style: none; padding: 0; display: grid; gap: 8px; }
ul.examples li { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--bg); font-style: italic; }
.panel h2 .term { font-style: normal; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table.flags { border-collapse: collapse; width: 100%; min-width: 480px; font-size: 0.88rem; }
table.flags th, table.flags td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--track); }
table.flags th { font: 600 0.72rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); background: var(--bg); }
table.flags td:first-child { font-weight: 700; }
.chips.quiet { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.quiet span { border: 1px dashed var(--line); border-radius: 99px; padding: 3px 10px; font-size: 0.85rem; color: var(--ink-soft); }
.tasklist button span:last-child { min-width: 0; }
.fnode { cursor: pointer; }
.fnode:focus { outline: none; }
.fnode:focus-visible rect, .fnode:focus-visible path { stroke-dasharray: 5 3; stroke-width: 3; }
.fnode:hover rect, .fnode:hover path { filter: brightness(0.97); }
.flow .fedge { stroke: currentColor; stroke-width: 1.5; fill: none; }
.flow .fhead { font: 700 16px var(--font-display); }
.flow .fhead2 { font: 700 11.5px var(--font-mono); letter-spacing: 0.06em; }
.flow .flabel { font: 700 12.5px/1.3 var(--font-body); }
.flow .ftext { font: 12.5px/1.3 var(--font-body); }
.flow .fq { font: 700 10.5px var(--font-mono); letter-spacing: 0.06em; }
.flow .fyes { font: 700 11px var(--font-mono); fill: var(--ink-soft); }
#legend-flow { left: auto; right: 12px; }
@media (max-width: 860px) { #legend-flow { display: none; } }
</style>

<script>
/* ---------- Glossary: plain definitions shown on hover or tap ---------- */
const GLOSSARY = {
  "hook": ["Hook", "Your own code that runs automatically at a fixed moment, for example just before a tool runs. It can block an action, so it gives a guarantee a prompt cannot."],
  "pretooluse": ["PreToolUse", "A hook that runs just before a tool runs. It can deny the call, so the action never happens."],
  "posttooluse": ["PostToolUse", "A hook that runs just after a tool has run. It can reshape the result before Claude sees it, but cannot undo the call."],
  "subagent": ["Subagent", "A helper Claude session with its own task and its own context. It returns only its result to the coordinator."],
  "coordinator": ["Coordinator", "The lead agent in a multi-agent system. It splits the job, hands parts to subagents and combines their results."],
  "stop_reason": ["stop_reason", "A field on every Claude reply that says why it stopped. \"tool_use\" means it wants a tool run; \"end_turn\" means it is finished."],
  "context": ["Context window", "Everything Claude can see right now: instructions, the conversation, tool results. It has a size limit, so clutter pushes out useful detail."],
  "fork_session": ["fork_session", "An option when resuming a session: it makes a copy that continues on its own path, while the original stays unchanged."],
  "tool_choice": ["tool_choice", "A request setting: auto (model decides), any (must call some tool), a named tool (must call that one), or none."],
  "iserror": ["isError", "A flag on an MCP tool result. true means the tool ran but failed; the content says why."],
  "claude.md": ["CLAUDE.md", "A Markdown file of instructions Claude Code reads at the start of a session. Where it is saved decides who gets it."],
  "custom_id": ["custom_id", "Your own label on each request in a batch. Results can come back in any order, so you match them by this id."],
  "few-shot": ["Few-shot examples", "A few worked examples in the prompt (input and the exact output you want), so the model copies the pattern."],
  "escalation": ["Escalation", "Handing a case from the agent to a human."],
  "handoff": ["Handoff", "What the agent passes to the human: a short structured summary, because the human cannot see the transcript."],
  "gate": ["Deterministic gate", "A check in code that always runs, so the action cannot happen until the condition is met."],
  "prerequisite": ["Prerequisite", "A step that must succeed first. Code blocks the next tool until it has, for example no refund until the customer's ID is verified."],
  "fork": ["context: fork", "A skill setting. The skill runs in its own separate subagent, and only its short summary comes back to the main conversation."],
  "allowed-tools": ["allowed-tools", "A skill setting that lists the tools the skill may use. The exam guide treats it as a limit on the skill's tools."],
  "plan mode": ["Plan mode", "A Claude Code mode where Claude looks around and proposes a plan without changing files. You approve the plan, then it acts."],
  "sla": ["SLA", "A deadline promised to a customer, for example “results within 30 hours”."],
  "ci": ["CI", "Automated checks that run on every code change, with nobody at a keyboard to answer questions."],
  ".mcp.json": [".mcp.json", "A file in the project that lists the MCP servers. Committed to the repo, so everyone who clones it gets the same servers."],
  "case facts": ["Case-facts block", "A short structured list of exact facts (order IDs, amounts, dates, statuses). It is sent with every prompt, outside any summary, so the facts never blur."]
};

/* ---------- Plain names for the domain and task codes ---------- */
const DOMAINS = { d1: "Agentic architecture", d2: "Tools & MCP", d3: "Claude Code setup", d4: "Prompts & output", d5: "Context & reliability" };
const TASKS = {
  "1.1": "agent loops", "1.2": "coordinator and subagents", "1.3": "passing context to subagents", "1.4": "enforced workflows and handoffs",
  "1.5": "hooks", "1.6": "splitting up the work", "1.7": "sessions: resume and fork",
  "2.1": "tool descriptions", "2.2": "tool errors", "2.3": "which agent gets which tools", "2.4": "connecting MCP servers", "2.5": "built-in tools",
  "3.1": "CLAUDE.md levels", "3.2": "commands and skills", "3.3": "path-specific rules", "3.4": "plan mode or act directly", "3.5": "refining step by step", "3.6": "CI pipelines",

// Bump when the page changes, so a learner's published copy gets republished.
const MAP_VERSION = "2026-10-09";

/* ---------- Model ----------
   One flowchart: a new question → reading routine → "What is it about?" → a trunk feeding one
   row per situation. Each row: the situation box, then Q1 → No → Q2 → … → the default; Yes drops
   from each question to its answer box. */
const SIGNALS = {};
ROUTER.forEach(([sig, id]) => { (SIGNALS[id] = SIGNALS[id] || []).push(sig); });
const byKey = {};
CHARTS.forEach(c => {
  c.steps.forEach((s, i) => { s.n = i + 1; s.key = c.id + "." + s.id; s.chart = c; byKey[s.key] = s; });
  c.fallback.key = c.id + ".fb"; c.fallback.isDefault = true; c.fallback.chart = c; byKey[c.fallback.key] = c.fallback;
});

/* ---------- Geometry ---------- */
const SX = 0, SW = 320;            // situation boxes
const X0 = SX + SW + 150, STEP = 330; // first question centre, spacing between questions
const DW = 180, DH = 96, BW = 280;  // diamond and answer box sizes
const TRUNK = -70;
function plain(s) { return String(s).replace(/\{\{([^}|]+)(?:\|([^}]+))?\}\}/g, (m, k, l) => l || (GLOSSARY[k.toLowerCase()] || [k])[0]); }
function brief(s) {
  let t = plain(s); const cut = t.search(/\.(\s|$)/); if (cut > 20) t = t.slice(0, cut);
  return t.length > 118 ? t.slice(0, t.lastIndexOf(" ", 115)) + "…" : t;
}
function wrap(s, max) {
  const out = []; let line = "";
  s.split(/\s+/).forEach(w => { if ((line + " " + w).trim().length > max && line) { out.push(line); line = w; } else line = (line + " " + w).trim(); });
  if (line) out.push(line); return out;
}
const G = { rows: {}, nodes: {}, top: {}, bounds: [0, 0, 0, 0] };
function computeLayout() {
  let y = 0;
  const cx = SX + SW / 2;
  // start pill and the reading routine
  G.top.start = { x: cx - 160, y, w: 320, h: 44 }; y += 44 + 34;
  G.top.routine = ROUTINE.map(([t, d], i) => { const lines = wrap(t, 34); const h = 30 + lines.length * 16; const r = { x: cx - 160, y, w: 320, h, i, lines }; y += h + 30; return r; });
  const last = G.top.routine[G.top.routine.length - 1];
  G.top.flags = { x: last.x + last.w + 70, y: last.y + last.h / 2 - 38, w: 250, h: 76 };
  const rdH = 140, rdW = 300;
  G.top.router = { cx, cy: y + rdH / 2, w: rdW, h: rdH }; y += rdH + 60;
  // one row per situation
  CHARTS.forEach(c => {
    const sig = wrap((SIGNALS[c.id] || []).join(" / "), 40);
    const sigH = 40 + sig.length * 16;
    const ans = [...c.steps, c.fallback].map(s => wrap(brief(s.a), 38));
    const boxH = Math.max(...c.steps.map((s, i) => 48 + (ans[i].length - 1) * 16));
    const dfH = 48 + (ans[ans.length - 1].length - 1) * 16;
    const top = y, midY = top + Math.max(DH, sigH, dfH) / 2;
    const row = { c, top, midY, sig, sigH, ans, boxH, dfH };
    row.steps = c.steps.map((s, i) => ({ s, cx: X0 + i * STEP, cy: midY, box: { x: X0 + i * STEP - BW / 2, y: midY + DH / 2 + 46, w: BW, h: boxH } }));
    const dfx = X0 + c.steps.length * STEP;
    row.fb = { s: c.fallback, box: { x: dfx - BW / 2, y: midY - dfH / 2, w: BW, h: dfH } };
    row.right = dfx + BW / 2;
    row.bottom = midY + DH / 2 + 46 + boxH;
    G.rows[c.id] = row;
    y = row.bottom + 90;
  });
  const right = Math.max(...Object.values(G.rows).map(r => r.right));
  G.bounds = [TRUNK - 40, -20, Math.max(right, G.top.flags.x + G.top.flags.w) + 40, y - 50];
}

  if (!sel || sel.kind === "root") h = rootHtml();
  else if (sel.kind === "routine") h = routineHtml(sel.id);
  else if (sel.kind === "flags") h = flagsHtml();
  else if (sel.kind === "chart") h = chartHtml(CHARTS.find(c => c.id === sel.id));
  else h = stepHtml(byKey[sel.id]);
  panel.innerHTML = `<div class="panel-inner">${h}</div>`; panel.scrollTop = 0;
  panel.querySelectorAll("[data-chart]").forEach(b => b.addEventListener("click", () => pick({ kind: "chart", id: b.dataset.chart })));
  panel.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => pick({ kind: "step", id: b.dataset.step })));
  panel.querySelectorAll("[data-routine]").forEach(b => b.addEventListener("click", () => pick({ kind: "routine", id: +b.dataset.routine })));
  panel.querySelectorAll("[data-flags]").forEach(b => b.addEventListener("click", () => pick({ kind: "flags" })));
  panel.querySelectorAll("[data-root]").forEach(b => b.addEventListener("click", () => pick({ kind: "root" })));
}

/* ---------- Glossary tooltip ---------- */
const tip = document.getElementById("tip");
function showTip(t) {
  const g = GLOSSARY[t.dataset.g]; if (!g) return;
  tip.innerHTML = `<b>${esc(g[0])}</b>${esc(g[1])}`; tip.hidden = false;
  const r = t.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = Math.min(window.innerWidth - tw - 8, Math.max(8, r.left + r.width / 2 - tw / 2)), y = r.top - th - 8; if (y < 8) y = r.bottom + 8;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
document.addEventListener("mouseover", e => { const t = e.target.closest(".term"); if (t) showTip(t); });
document.addEventListener("mouseout", e => { if (e.target.closest(".term")) tip.hidden = true; });
document.addEventListener("focusin", e => { const t = e.target.closest(".term"); if (t) showTip(t); });
document.addEventListener("focusout", e => { if (e.target.closest(".term")) tip.hidden = true; });
panel.addEventListener("scroll", () => { tip.hidden = true; });

computeLayout();
draw();
const vb = G.bounds; view = [vb[0], vb[1], vb[2] - vb[0], vb[3] - vb[1]]; svg.setAttribute("viewBox", view.join(" "));
pick({ kind: "root" });

/* ---------- Resizable panel ---------- */
(function () {
  const app = document.querySelector(".app"), stage = document.querySelector(".stage"), KEY = "ccaf-map-panel-width";
  const h = document.createElement("div");
  h.className = "panel-handle"; h.tabIndex = 0; h.setAttribute("role", "separator"); h.setAttribute("aria-orientation", "vertical");
  h.setAttribute("aria-label", "Resize the panel. Drag, or use the left and right arrow keys. Double-click to reset.");
  stage.appendChild(h);
  const clamp = w => Math.max(300, Math.min(w, window.innerWidth * 0.75));
  const refit = () => window.dispatchEvent(new Event("resize"));
  function setW(w, store) {
    if (w == null) app.style.removeProperty("--panel-w"); else app.style.setProperty("--panel-w", Math.round(clamp(w)) + "px");
    if (store) { try { w == null ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, String(Math.round(clamp(w)))); } catch (e) {} }
  }
  try { const saved = +localStorage.getItem(KEY); if (saved) setW(saved, false); } catch (e) {}
  let drag = null;
  h.addEventListener("pointerdown", e => { drag = true; h.setPointerCapture(e.pointerId); h.classList.add("dragging"); document.body.classList.add("resizing"); e.preventDefault(); });
  h.addEventListener("pointermove", e => { if (drag) setW(window.innerWidth - e.clientX, false); });
  function end() { if (!drag) return; drag = null; h.classList.remove("dragging"); document.body.classList.remove("resizing"); setW(document.querySelector(".panel").getBoundingClientRect().width, true); refit(); }
  h.addEventListener("pointerup", end); h.addEventListener("pointercancel", end);
  h.addEventListener("dblclick", () => { setW(null, true); refit(); });
  h.addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    const cur = document.querySelector(".panel").getBoundingClientRect().width;
    setW(cur + (e.key === "ArrowLeft" ? 32 : -32), true); refit();
  });
})();

/* ---------- Resizable map height (narrow layout: map on top, panel below) ---------- */
(function () {
  const app = document.querySelector(".app"), stage = document.querySelector(".stage"), KEY = "ccaf-map-height";
  const h = document.createElement("div");
  h.className = "stage-handle"; h.tabIndex = 0; h.setAttribute("role", "separator"); h.setAttribute("aria-orientation", "horizontal");
  h.setAttribute("aria-label", "Resize the map. Drag, or use the up and down arrow keys. Double-click to reset.");
  stage.appendChild(h);
  const clamp = v => Math.max(160, Math.min(v, window.innerHeight * 0.85));
  const refit = () => window.dispatchEvent(new Event("resize"));
  function setH(v, store) {
    if (v == null) app.style.removeProperty("--map-h"); else app.style.setProperty("--map-h", Math.round(clamp(v)) + "px");
    if (store) { try { v == null ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, String(Math.round(clamp(v)))); } catch (e) {} }
  }
  try { const saved = +localStorage.getItem(KEY); if (saved) setH(saved, false); } catch (e) {}
  let drag = false;
  h.addEventListener("pointerdown", e => { drag = true; h.setPointerCapture(e.pointerId); h.classList.add("dragging"); document.body.classList.add("resizing-v"); e.preventDefault(); });
  h.addEventListener("pointermove", e => { if (drag) setH(e.clientY - stage.getBoundingClientRect().top, false); });
  function end() { if (!drag) return; drag = false; h.classList.remove("dragging"); document.body.classList.remove("resizing-v"); setH(stage.getBoundingClientRect().height, true); refit(); }
  h.addEventListener("pointerup", end); h.addEventListener("pointercancel", end);
  h.addEventListener("dblclick", () => { setH(null, true); refit(); });
  h.addEventListener("keydown", e => {
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    e.preventDefault();
    setH(stage.getBoundingClientRect().height + (e.key === "ArrowDown" ? 32 : -32), true); refit();
  });
})();
</script>
</body>
